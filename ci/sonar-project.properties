sonar.projectKey=onec-config
sonar.projectName=onec-config
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.inclusions=**/*.bsl,**/*.os
# Плагин sonar-bsl-plugin-community: диагностики BSL LS попадают в Sonar как issues
sonar.bsl.languageserver.enabled=true
sonar.bsl.languageserver.configPath=.bsl-language-server.json
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
