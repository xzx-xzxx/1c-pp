name: lint
on: [pull_request]
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: for f in ci/scripts/*.sh; do bash -n "$f"; done
      - name: yaml
        run: pip install yamllint && yamllint -d relaxed $(ls ci/.gitlab-ci.yml docker/docker-compose.yml 2>/dev/null)
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
