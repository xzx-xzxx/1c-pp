sonar.projectKey=onec-config
sonar.projectName=onec-config
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.inclusions=**/*.bsl,**/*.os
# Диагностики BSL берёт плагин sonar-bsl-plugin-community; набор правил задаёт профиль качества
# «BSL Language Server rules» в Sonar, а не .bsl-language-server.json (проверено: файл на Sonar не влияет).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
